name: N64 ROM Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-rom:
    runs-on: ubuntu-latest
    # Dieser Befehl zwingt die gesamte Cloud-Maschine, direkt im offiziellen Libdragon-System zu starten
    container: ghcr.io/libdragon/libdragon:trunk

    steps:
    # 1. Quellcode aus deinem Repository in die Umgebung laden
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2. Das Makefile nativ im N64-System ausführen
    - name: Build N64 ROM
      run: |
        make
        
    # 3. Das fertige ROM als Website-Download bereitstellen
    - name: Upload N64 ROM Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ultra-racer-rom
        path: ./*.z64
