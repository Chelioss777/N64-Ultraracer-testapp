name: N64 ROM Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-rom:
    runs-on: ubuntu-latest

    steps:
    # 1. Quellcode aus deinem Repository laden
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2. Das offizielle Libdragon-Bausystem v5 starten
    # Dieses Tool läuft nativ auf Node 24 und installiert die Toolchain fehlerfrei im Hintergrund!
    - name: Build N64 ROM
      uses: dragonminded/libdragon@v5
      with:
        build-args: 'make'

    # 3. Das fertige ROM als Website-Download bereitstellen
    - name: Upload N64 ROM Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ultra-racer-rom
        path: ./*.z64
