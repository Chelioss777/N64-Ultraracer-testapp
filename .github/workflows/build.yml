name: N64 ROM Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-rom:
    runs-on: ubuntu-22.04

    steps:
    # 1. Quellcode aus deinem Repository laden
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2. Den echten MIPS-Compiler direkt in die Cloud installieren
    - name: Install MIPS Compiler
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-mips64-linux-gnu binutils-mips64-linux-gnu make

    # 3. Das ROM direkt auf der Cloud-Maschine kompilieren
    - name: Build N64 ROM
      run: |
        make

    # 4. Das fertige ROM als Website-Download bereitstellen (KORRIGIERT)
    - name: Upload N64 ROM Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ultra-racer-rom
        path: ./*.z64
