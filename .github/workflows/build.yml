name: N64 ROM Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-rom:
    runs-on: ubuntu-latest
    # Wir wechseln auf das aktive, funktionierende Community-Image der N64Brew-Organisation
    container: ghcr.io/n64brew/ubuntu-toolchain:latest

    steps:
    # 1. Quellcode aus deinem Repository laden
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2. Das Makefile im Container ausführen
    # Wir übergeben den korrekten internen Pfad der Toolchain (/usr/local) an das System
     Buchstabe  Build N64 ROM
      run: |
        make N64_INST=/usr/local
        
    # 3. Das fertige ROM als Website-Download bereitstellen
    - name: Upload N64 ROM Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ultra-racer-rom
        path: ./*.z64
