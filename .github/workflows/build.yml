name: N64 ROM Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-rom:
    runs-on: ubuntu-latest

    steps:
    # 1. Quellcode aus deinem Repository laden
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2. Das offizielle Libdragon-System für GitHub Actions starten
    # Dieses Tool übernimmt das Laden der Toolchain und das Ausführen des Makefiles vollautomatisch!
    - name: Build N64 ROM
      uses: libdragon/actions/make@main

    # 3. Das fertige ROM als Website-Download bereitstellen
    - name: Upload N64 ROM Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ultra-racer-rom
        path: ./*.z64
