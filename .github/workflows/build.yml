name: N64 ROM Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-rom:
    runs-on: ubuntu-latest

    steps:
    # 1. Quellcode laden
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2. Bauen mit dem verlässlichen Docker Hub Image
    - name: Build ROM with Libdragon
      run: |
        docker run --rm -v "$PWD:/n64dev" -w /n64dev dragonminded/libdragon:latest make

    # 3. Das fertige ROM als Website-Download bereitstellen
    - name: Upload N64 ROM Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ultra-racer-rom
        path: ./*.z64
